[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
testpaths = tests core/tests healthHub/tests users/tests
python_files = tests.py test_*.py *_tests.py
addopts = -ra --strict-markers --strict-config
markers =
    unit: isolated business rules without a database
    integration: routes, ORM, templates, or collaborating services
    security: authentication, authorization, privacy, or CSRF regression
    performance: deterministic database query budgets
    regression: expected behavior that previously failed
