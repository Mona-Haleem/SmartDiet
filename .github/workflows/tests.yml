name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -m "not postgresql" --cov --cov-report=xml:coverage/python.xml --cov-report=json:coverage/python.json --junitxml=coverage/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: coverage/

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smartdiet_tests
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: smartdiet_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdiet_tests -d smartdiet_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SMARTDIET_TEST_POSTGRES_PORT: "5432"
      SMARTDIET_TEST_POSTGRES_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -m postgresql --junitxml=coverage/postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-concurrency-results
          path: coverage/postgres.xml

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --json --outputFile=coverage/jest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-test-results
          path: coverage/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            coverage/playwright-report/
            test-results/
