{% load static %}
<div class="item_viewer h-100 w-100 p-4">
  <div class="w-100 card-list-grid"
       x-data="{items:{{result.items}},mode:'{{mode}}',activeMenu:null}"
       x-init="$nextTick(()=>{
         cardList = new CardList($el,$refs,$data,paginator.updateData.bind(paginator));
         paginator.pageClass = cardList;
       })" @click.away="activeMenu = null" @keydown.escape="activeMenu = null">
    <template x-for="(item,index) in items" :key="item.id">
      <div class="ele-container p-2" :id="item.id" :data-type="item.type">
        <div class="image-container h-100 w-100" :class="item.type === 'recipe' ? 'recipe' : item.category" :title="`Last Edited:${item.edited}`">
          <a :href="item.details_path" :aria-label="'Open ' + item.name">
            <img :src="item.media" :alt="item.name" width="300" height="200" :loading="index < 4 ? 'eager' : 'lazy'" decoding="async"
                 data-fallback="{% static 'assets/logo.png' %}" onerror="this.src=this.dataset.fallback;" />
          </a>
          <div class="gradient-overlay"></div>
          <div class="image-details">
            <h5 class="m-0 p-0">
              <span aria-hidden="true" x-html="item.favorite ? '&#9829;' : '&#9825;'"></span>
              <a :href="item.details_path" x-text="item.name"></a>
            </h5>
            <p class="m-0 p-0"><a :href="'{% url 'discover' %}'+item.creatorId+'/'" x-text="item.creator"></a></p>
            <p class="m-0 p-0">Created: <span x-text="item.created"></span></p>
            <p class="m-0 p-0" x-text="item.notes"></p>
          </div>
        </div>
        <template x-if="mode === 'user'">
          <div class="card-menu-container" :class="item.type === 'recipe' ? 'recipe' : item.category">
            <button type="button" class="card-menu-btn" :aria-label="'Actions for ' + item.name"
                    :aria-expanded="activeMenu === item.id" :aria-controls="'card-actions-' + item.id"
                    @click.prevent="activeMenu = activeMenu === item.id ? null : item.id">
              <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
            </button>
            <div class="card-menu-dropdown" :id="'card-actions-' + item.id" x-show="activeMenu === item.id" x-transition @click.stop>
              <button type="button" class="card-menu-item" @click="cardList.updateServerData(item.id,'favorite',!item.favorite);activeMenu=null">
                <span x-text="item.favorite ? 'Remove from Favorites' : 'Add to Favorites'"></span>
              </button>
              <button type="button" class="card-menu-item" @click="cardList.updateServerData(item.id,'shared',!item.shared);activeMenu=null">
                <span x-text="item.shared ? 'Make Private' : 'Make Shared'"></span>
              </button>
              <button type="button" class="card-menu-item delete" @click="cardList.deleteEle(item.id);activeMenu=null">Delete Item</button>
            </div>
          </div>
        </template>
      </div>
    </template>
    <div class="no-items" x-show="items.length === 0"><p>No items found.</p></div>
  </div>
  <div class="page">
    <input name="pageNumber" type="number" min="1" aria-label="Page number"
           @change="paginator.paginateTo($event.target.value)" x-model="page" />
  </div>
</div>
