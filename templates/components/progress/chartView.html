<div class="chart-wrapper">
  <div class="chart-header">
    <h4 class="chart-title">Progress Over Time</h4>
    <div class="chart-legend">
      <span class="legend-item">
        <span class="legend-color overall"></span>
        <span x-text="$data.chartName"></span>
      </span>
    </div>
  </div>

  <div class="chart-container">
    <canvas x-ref="chartCanvas" 
            id="progressChart"
            role="img" aria-label="Progress over time; equivalent values follow in the data table"
            :height="$data.chartHeight"></canvas>
  </div>
  <details class="chart-data-table">
    <summary>View progress data</summary>
    <table>
      <caption>Daily overall progress scores</caption>
      <thead><tr><th scope="col">Date</th><th scope="col">Score</th></tr></thead>
      <tbody><template x-for="row in ($data.chartRows || [])" :key="row.date">
        <tr><td x-text="row.date"></td><td x-text="row.overall_score + '%'"></td></tr>
      </template></tbody>
    </table>
  </details>

            :class="{ 'active': !$data.selectedMetric }"
            @click="periodProgress.showOverallProgress()">
      <i class="fas fa-chart-line"></i>
      Overall
    </button>
  </div> -->
</div>
